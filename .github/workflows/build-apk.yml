name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Debug APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          java -version
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          RAW_VERSION="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"

          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version from: $JAVA_VERSION_OUTPUT"
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected invalid Java major version '$MAJOR_VERSION' from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION (raw: $RAW_VERSION)"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./debug.keystore ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found at $KEYTOOL_BIN"
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Temporary debug keystore ./debug.keystore was not created or is empty."
            exit 1
          fi

          echo "Temporary debug keystore verified at ./debug.keystore."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ] || [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::Expected debug APK not found or invalid at: $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered .apk files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          APK_SIZE="$(wc -c < "$APK_PATH")"
          echo "Verified debug APK: $APK_PATH (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_DIR="${RUNNER_TEMP}/release-apk-asset"
          mkdir -p "$ASSET_DIR"

          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid at: $ASSET_PATH"
            exit 1
          fi

          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset does not exist or is invalid: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Artifact Filename:** ${ASSET_NAME}

          > **Notice:** This build is intended for testing only. It is signed with a temporary debug keystore and is **not** a Google Play Store production release.
          EOF
          )

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare_asset.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [ "$BUILD_OUTCOME" != "success" ] || [ "$VERIFY_OUTCOME" != "success" ] || [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "::error::APK build or artifact upload failed (build=${BUILD_OUTCOME}, verify=${VERIFY_OUTCOME}, artifact=${ARTIFACT_OUTCOME})."
            {
              echo "## Debug APK Build Failed"
              echo ""
              echo "The debug APK build or artifact upload did not succeed (build: \`${BUILD_OUTCOME}\`, verify: \`${VERIFY_OUTCOME}\`, artifact: \`${ARTIFACT_OUTCOME}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$PREPARE_OUTCOME" = "success" ] && [ "$PUBLISH_OUTCOME" = "success" ] && [ -n "${RELEASE_TAG:-}" ]; then
            RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json url,tagName,name,assets)"
            RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.url')"
            VERIFIED_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tagName')"
            VERIFIED_TITLE="$(printf '%s' "$RELEASE_JSON" | jq -r '.name')"
            VERIFIED_ASSET="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '([.assets[] | select(.name == $name) | .name][0]) // ([.assets[].name][0] // "")')"

            echo "Release Tag: ${VERIFIED_TAG}"
            echo "Release Title: ${VERIFIED_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${VERIFIED_ASSET}"

            {
              echo "## Debug APK Ready for Download"
              echo ""
              echo "- **Release Title:** ${VERIFIED_TITLE}"
              echo "- **Release Tag:** \`${VERIFIED_TAG}\`"
              echo "- **APK Asset:** \`${VERIFIED_ASSET}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "### How to Install on Your Phone"
              echo "1. Open the GitHub Release page above in your phone's browser."
              echo "2. Expand the **Assets** section and tap \`${VERIFIED_ASSET}\` to download it."
              echo "3. Open the downloaded \`.apk\` file to install the debug build."
              echo ""
              echo "_Backup:_ The GitHub Actions workflow artifact \`app-debug-apk\` is also available on this run's summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed (prepare=${PREPARE_OUTCOME}, publish=${PUBLISH_OUTCOME}). The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no Release URL was created. However, the debug APK build succeeded."
              echo ""
              echo "### Backup Download"
              echo "Download the \`app-debug-apk\` artifact directly from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
